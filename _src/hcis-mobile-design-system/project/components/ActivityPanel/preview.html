<!-- @dsCard group="Panel" height=760 subtitle="Isi panel aktivitas" -->
<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ev-bg);font-family:var(--font-body);font-variant-numeric:tabular-nums;color:var(--ev-ink);padding:var(--ev-sp-16);-webkit-font-smoothing:antialiased}
.cap{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ev-ink-2);margin:0 0 var(--ev-sp-6)}
.row{display:flex;flex-wrap:wrap;gap:var(--ev-sp-12);align-items:flex-start;margin-bottom:var(--ev-sp-16)}
.col{display:flex;flex-direction:column;gap:var(--ev-sp-6)}
button{font-family:inherit;border:0;cursor:pointer}
</style>
<style>
.jr{margin:0 var(--ev-sp-14) var(--ev-sp-8);display:flex;align-items:center;gap:var(--ev-sp-12);padding:var(--ev-sp-10) var(--ev-sp-6) var(--ev-sp-10) var(--ev-sp-12);border-radius:var(--ev-r-xl);background:var(--ev-white);box-shadow:var(--ev-sh-row);max-width:390px}
.ex{flex:none;width:40px;height:40px;border-radius:var(--ev-r-md);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;letter-spacing:.2px}
.md{flex:1;min-width:0}.t{display:block;font-size:14px;line-height:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.s{display:block;font-size:12px;line-height:18px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg{display:flex;align-items:center;gap:var(--ev-sp-8);height:18px}.tr{flex:1;height:6px;border-radius:var(--ev-r-xs);background:var(--ev-purple-100);overflow:hidden}.fi{display:block;height:100%;border-radius:var(--ev-r-xs);background:var(--ev-purple-600)}.pc{flex:none;min-width:34px;text-align:right;font-size:12px;line-height:18px;font-weight:600;color:var(--ev-purple-800)}
.bt{flex:none;min-width:56px;height:44px;font-size:13px;font-weight:600;color:var(--ev-ink-2);background:none}
.ac{flex:none;height:44px;margin-right:var(--ev-sp-8);display:flex;align-items:center;background:none}.ac span{height:34px;padding:0 var(--ev-sp-14);border-radius:var(--ev-r-lg);font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px}
.sw{flex:none;width:60px;height:44px;display:flex;align-items:center;justify-content:center;background:none}.trk{position:relative;width:44px;height:26px;border-radius:var(--ev-r-md);display:block}.kn{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:var(--ev-r-full);background:var(--ev-white);box-shadow:0 2px 4px rgba(26,21,53,.3);display:block}

body{padding:0}
.pn{width:390px;height:760px;margin:0 auto;display:flex;flex-direction:column;background:var(--ev-bg)}
.tl{flex:none;display:flex;gap:var(--ev-sp-8);padding:var(--ev-sp-14) var(--ev-sp-16) var(--ev-sp-4)}
.cnt{flex:1;border-radius:var(--ev-r-lg);padding:9px var(--ev-sp-12);box-shadow:var(--ev-sh-pop)}.cnt em{display:block;font-style:normal;font-size:12px;font-weight:600}.cnt b{display:block;font-family:var(--font-display);font-size:26px;line-height:1.15;font-weight:800}
.sc{flex:1;min-height:0;overflow-y:auto;padding-bottom:var(--ev-sp-6)}
.gh{margin:0;padding:var(--ev-sp-10) var(--ev-sp-20) var(--ev-sp-6);font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--ev-purple-accent)}
.cl{flex:none;width:100%;height:52px;padding-bottom:var(--ev-sp-6);background:var(--ev-white);box-shadow:0 -10px 20px -14px rgba(45,23,120,.3);font-size:13px;font-weight:700;color:var(--ev-purple-800)}
</style></head><body>
<div class="pn"><div class="tl"><div class="cnt" style="background:var(--ev-purple-100);border:1px solid var(--ev-purple-edge)"><em style="color:var(--ev-purple-800)">Berjalan</em><b>1</b></div><div class="cnt" style="background:var(--ev-ok-bg);border:1px solid var(--ev-ok-edge)"><em style="color:var(--ev-ok-ink)">Selesai</em><b>2</b></div><div class="cnt" style="background:var(--ev-info-bg);border:1px solid var(--ev-info-edge)"><em style="color:var(--ev-info-ink)">Terjadwal</em><b>1</b></div></div>
<div class="sc">
<p class="gh">Berjalan · 1</p><div class="jr"><span class="ex" style="background:var(--ev-ok-bg);border:1px solid var(--ev-ok-edge);color:var(--ev-ok-ink)">XLSX</span><div class="md"><span class="t">Export riwayat cuti</span><div class="pg"><span class="tr"><span class="fi" style="width:64%"></span></span><span class="pc">64%</span></div></div><button class="bt" aria-label="Batalkan">Batal</button></div>
<p class="gh">Selesai · 2</p><div class="jr"><span class="ex" style="background:var(--ev-no-bg);border:1px solid var(--ev-no-edge);color:var(--ev-no-ink)">PDF</span><div class="md"><span class="t">Slip cuti Oktober</span><span class="s" style="color:var(--ev-ink-2)">4 Nov · 124 KB</span></div><button class="ac"><span style="background:var(--ev-purple-600);color:var(--ev-white)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>Unduh</span></button></div><div class="jr"><span class="ex" style="background:var(--ev-ok-bg);border:1px solid var(--ev-ok-edge);color:var(--ev-ok-ink)">XLSX</span><div class="md"><span class="t">Export jadwal shift</span><span class="s" style="color:var(--ev-no-ink)">Gagal · koneksi terputus</span></div><button class="ac"><span style="background:var(--ev-no-bg);color:var(--ev-no-ink)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg>Ulangi</span></button></div>
<p class="gh">Terjadwal · 1</p><div class="jr"><span class="ex" style="background:var(--ev-ok-bg);border:1px solid var(--ev-ok-edge);color:var(--ev-ok-ink)">XLSX</span><div class="md"><span class="t">Rekap absensi mingguan</span><span class="s" style="color:var(--ev-ink-2)">Setiap Senin · 07.00</span></div><button class="sw" role="switch" aria-checked="true"><span class="trk" style="background:var(--ev-purple-600)"><span class="kn" style="transform:translateX(18px)"></span></span></button></div>
</div><button class="cl">Bersihkan yang selesai</button></div></body></html>
