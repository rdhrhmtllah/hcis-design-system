<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ev-bg);font-family:var(--font-body);font-variant-numeric:tabular-nums;color:var(--ev-ink);padding:var(--ev-sp-16);-webkit-font-smoothing:antialiased}
.cap{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ev-ink-2);margin:0 0 var(--ev-sp-6)}
.row{display:flex;flex-wrap:wrap;gap:var(--ev-sp-12);align-items:flex-start;margin-bottom:var(--ev-sp-16)}
.col{display:flex;flex-direction:column;gap:var(--ev-sp-6)}
button{font-family:inherit;border:0;cursor:pointer}
</style>
<style>
.ac{background:var(--ev-white);border-radius:var(--ev-r-2xl);box-shadow:var(--ev-sh-card);overflow:hidden}
.k{width:100%;min-height:72px;padding:var(--ev-sp-12) var(--ev-sp-12) var(--ev-sp-12) var(--ev-sp-14);display:flex;align-items:center;gap:var(--ev-sp-12);text-align:left;background:transparent}
.ti{flex:none;width:42px;height:42px;border-radius:var(--ev-r-lg);background:var(--ev-purple-100);border:1px solid var(--ev-purple-edge);color:var(--ev-purple-800);display:flex;align-items:center;justify-content:center}.ti.ok{background:var(--ev-no-bg);border-color:var(--ev-no-edge);color:var(--ev-no-ink)}
.tx{flex:1;min-width:0}.tx b{display:block;font-size:15px;line-height:20px;font-weight:700;color:var(--ev-ink)}.tx small{display:block;margin-top:1px;font-size:12px;line-height:16px;font-weight:600;color:var(--ev-ink-2)}.tx em{display:block;margin-top:1px;font-style:normal;font-size:12px;line-height:16px;font-weight:600;color:var(--ev-purple-800)}
.rt{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:var(--ev-sp-6)}.gq{height:24px;padding:0 var(--ev-sp-10);border-radius:var(--ev-r-md);background:var(--ev-gold);font-size:12px;line-height:24px;font-weight:600;color:var(--ev-gold-ink);white-space:nowrap}
.cv{display:flex;color:var(--ev-purple-800);transform:rotate(180deg)}
.bd{padding:var(--ev-sp-2) var(--ev-sp-14) var(--ev-sp-14);border-top:1px solid var(--ev-purple-50)}
.bd ul{list-style:none;margin:var(--ev-sp-10) 0 0;padding:0;display:flex;flex-direction:column;gap:var(--ev-sp-8)}.bd li{position:relative;padding-left:17px;font-size:13px;line-height:1.45;font-weight:500}.bd li::before{content:"";position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:var(--ev-r-xs);background:var(--ev-purple-400)}
.fl{margin-top:var(--ev-sp-14);padding:var(--ev-sp-12) var(--ev-sp-10) var(--ev-sp-10);border-radius:var(--ev-r-lg);background:var(--ev-tint);border:1px solid var(--ev-purple-100)}.fl>small{display:block;padding:0 var(--ev-sp-4);font-size:12px;font-weight:600;color:var(--ev-ink-2)}
.st{display:flex;margin-top:var(--ev-sp-12)}.st>div{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;text-align:center}
.st>div::before{content:"";position:absolute;z-index:0;top:10px;left:-50%;right:50%;height:4px;background:var(--ev-purple-100)}.st>div:first-child::before{display:none}.st>div:nth-child(2)::before{background:var(--ev-purple-600)}
.n{position:relative;z-index:1;font-style:normal;width:24px;height:24px;border-radius:var(--ev-r-md);background:var(--ev-white);box-shadow:inset 0 0 0 1.5px var(--ev-purple-300);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--ev-ink-2)}.n.d{background:var(--ev-purple-600);box-shadow:none;color:var(--ev-white)}
.st b{margin-top:var(--ev-sp-6);font-size:13px;line-height:18px;font-weight:700}.st small{font-size:12px;line-height:16px;font-weight:500;color:var(--ev-ink-2)}
</style></head><body>
<div class="col" style="max-width:370px;gap:var(--ev-sp-10)">
<article class="ac"><button class="k"><span class="ti"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8 3v4M16 3v4"/></svg></span><span class="tx"><b>Cuti tahunan</b><small>Memotong saldo</small><em>Alur: Atasan → HR</em></span><span class="rt"><span class="gq">12 hari / tahun</span><i class="cv"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></i></span></button>
<div class="bd"><ul><li>Berlaku setelah 12 bulan masa kerja.</li><li>Sisa cuti tidak dibawa ke tahun berikutnya.</li></ul>
<div class="fl"><small>Alur persetujuan</small><div class="st"><div><i class="n d">1</i><b>Kamu</b><small>Kirim</small></div><div><i class="n d">2</i><b>Atasan</b><small>Maks. 2 hari</small></div><div><i class="n">3</i><b>HR</b><small>Cek saldo</small></div></div></div></div></article>
<article class="ac"><button class="k"><span class="ti ok"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span><span class="tx"><b>Cuti sakit</b><small>Perlu surat dokter</small><em>Alur: Atasan → HR</em></span><span class="rt"><span class="gq">Sesuai dokter</span><i class="cv" style="transform:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></i></span></button></article>
</div></body></html>
