<!doctype html><html><head>
<link rel="stylesheet" href="../assets/tokens.css"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ev-bg);font-family:var(--font-body);font-variant-numeric:tabular-nums;color:var(--ev-ink);padding:var(--ev-sp-16);-webkit-font-smoothing:antialiased}
.cap{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ev-ink-2);margin:0 0 var(--ev-sp-6)}
.row{display:flex;flex-wrap:wrap;gap:var(--ev-sp-12);align-items:flex-start;margin-bottom:var(--ev-sp-16)}
.col{display:flex;flex-direction:column;gap:var(--ev-sp-6)}
button{font-family:inherit;border:0;cursor:pointer}
</style>
<style>
.cd{width:100%;max-width:370px;background:var(--ev-white);border-radius:var(--ev-r-2xl);box-shadow:var(--ev-sh-card);padding:var(--ev-sp-14)}
.hdr{display:flex;align-items:center;gap:var(--ev-sp-10);margin-bottom:var(--ev-sp-12)}.hdr h3{margin:0;flex:1;font-size:15px;font-weight:700}
.nb{flex:none;width:24px;height:24px;border-radius:var(--ev-r-md);background:var(--ev-purple-600);font-size:12px;font-weight:600;line-height:24px;text-align:center;color:var(--ev-white)}
.zn{width:100%;height:60px;border-radius:var(--ev-r-lg);border:2px dashed var(--ev-dash);background:var(--ev-field-bg);display:flex;align-items:center;justify-content:center;gap:var(--ev-sp-8);font-size:14px;font-weight:700;color:var(--ev-purple-800)}
.ok{position:relative;display:flex;align-items:center;gap:var(--ev-sp-12);padding:var(--ev-sp-10);border-radius:var(--ev-r-lg);background:var(--ev-ok-bg);border:1px solid var(--ev-ok-edge);overflow:hidden}
.tl{flex:none;width:40px;height:40px;border-radius:var(--ev-r-md);background:var(--ev-white);color:var(--ev-ok-ink);display:flex;align-items:center;justify-content:center}
.tx{flex:1;min-width:0}.tx b{display:block;font-size:14px;font-weight:700;color:var(--ev-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tx small{display:block;font-size:12px;font-weight:500;color:var(--ev-ok-ink)}
.rm{width:44px;height:44px;margin:-6px -6px -6px 0;background:transparent;color:var(--ev-ok-ink);display:flex;align-items:center;justify-content:center}
.up{background:var(--ev-purple-50);border-color:var(--ev-purple-edge)}.up .tl{color:var(--ev-purple-800)}.up small{color:var(--ev-ink-2)}
.pg{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--ev-purple-100)}.pg i{display:block;height:100%;background:var(--ev-purple-600)}
.er{background:var(--ev-no-bg);border-color:var(--ev-no-edge)}.er .tl{color:var(--ev-no-ink)}.er small{color:var(--ev-no-ink)}
.rt{flex:none;height:44px;padding:0 var(--ev-sp-8);background:transparent;color:var(--ev-no-ink);font-size:14px;font-weight:700}
</style></head><body>
<div class="cd"><div class="hdr"><span class="nb">4</span><h3>Surat dokter</h3></div>
<div class="col" style="gap:var(--ev-sp-10)">
<button class="zn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V5M7 10l5-5 5 5M5 20h14"/></svg>Unggah foto / PDF</button>
<div class="ok"><span class="tl"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></span><span class="tx"><b>surat-dokter.jpg</b><small>240 KB · terlampir</small></span><button class="rm" aria-label="Hapus lampiran"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
<div class="ok up"><span class="tl"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></span><span class="tx"><b>bukti-undangan.pdf</b><small>mengunggah 62%</small></span><i class="pg"><i style="width:62%"></i></i></div>
<div class="ok er"><span class="tl"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></span><span class="tx"><b>scan-lengkap.pdf</b><small>Ukuran 8 MB melebihi batas 5 MB</small></span><button class="rt">Coba lagi</button></div>
</div></div></body></html>
