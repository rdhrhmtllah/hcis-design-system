<!doctype html><html><head>
<link rel="stylesheet" href="../assets/tokens.css"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ev-bg);font-family:var(--font-body);font-variant-numeric:tabular-nums;color:var(--ev-ink);padding:var(--ev-sp-16);-webkit-font-smoothing:antialiased}

.row{display:flex;flex-wrap:wrap;gap:var(--ev-sp-12);align-items:flex-start;margin-bottom:var(--ev-sp-16)}
.col{display:flex;flex-direction:column;gap:var(--ev-sp-6)}

</style>
<style>

.ti{flex:none;width:40px;height:40px;border-radius:var(--ev-r-md);display:flex;align-items:center;justify-content:center}

.soon{flex:none;min-width:70px;margin-right:var(--ev-sp-8);padding-right:var(--ev-sp-8);text-align:right;font-size:12px;font-weight:600;color:var(--ev-ink-2)}
.nt{margin:0;padding:var(--ev-sp-10) var(--ev-sp-16) var(--ev-sp-12);font-size:12px;line-height:1.5;font-weight:500;color:var(--ev-ink-2)}

.cr{margin:0 var(--ev-sp-14) var(--ev-sp-8);max-width:362px;border-radius:var(--ev-r-xl);overflow:hidden;background:var(--ev-white);box-shadow:var(--ev-sh-row)}
.hd{width:100%;min-height:60px;text-align:left;display:flex;align-items:center;gap:var(--ev-sp-12);padding:var(--ev-sp-8) var(--ev-sp-14) var(--ev-sp-8) var(--ev-sp-16);background:none}
.hd .md{display:block}.hd .md b,.hd .md span{display:block}
.ex{padding:0 var(--ev-sp-16) var(--ev-sp-14) 68px}.ex p{margin:0 0 var(--ev-sp-8);font-size:12px;line-height:1.5;font-weight:500;color:var(--ev-ink-2)}
.bs{display:flex;gap:var(--ev-sp-8)}.ab{flex:1;min-height:56px;border-radius:var(--ev-r-lg);background:var(--ev-white);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600}
</style></head><body><div class="cr" style="background:var(--ev-tint)"><button class="hd" aria-expanded="true"><span class="ti" style="background:var(--ev-purple-100);border:1px solid var(--ev-purple-edge);color:var(--ev-purple-800);font-size:12px;font-weight:600">ESS</span><span class="md"><b>Employee Self Service</b><span>PIC: Rina Wulandari</span></span><span style="transform:rotate(180deg);display:flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ev-purple-800)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></button><div class="ex"><p>HR Operasional · Sen–Jum 08.00–17.00</p><div class="bs"><button class="ab" style="border:1px solid var(--ev-purple-edge);color:var(--ev-purple-800)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H11l-4.5 3.5V17H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg>Chat</button><button class="ab" style="border:1px solid var(--ev-purple-edge);color:var(--ev-purple-800)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 4h3l1.5 4-2 1.3a10 10 0 0 0 5.7 5.7L16 13l4 1.5v3A2.5 2.5 0 0 1 17.5 20 13.5 13.5 0 0 1 4 6.5 2.5 2.5 0 0 1 6.5 4z"/></svg>Ext. 1201</button><button class="ab" style="border:1px solid var(--ev-purple-edge);color:var(--ev-purple-800)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5h16v11H4zM4 7.5l8 6 8-6"/></svg>Email</button></div></div></div><div class="cr" style=""><button class="hd" aria-expanded="false"><span class="ti" style="background:var(--ev-ok-bg);border:1px solid var(--ev-ok-edge);color:var(-
