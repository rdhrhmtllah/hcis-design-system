<!doctype html><html><head>
<link rel="stylesheet" href="../assets/tokens.css"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ev-bg);font-family:var(--font-body);font-variant-numeric:tabular-nums;color:var(--ev-ink);padding:var(--ev-sp-16);-webkit-font-smoothing:antialiased}
.cap{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ev-ink-2);margin:0 0 var(--ev-sp-6)}
.row{display:flex;flex-wrap:wrap;gap:var(--ev-sp-12);align-items:flex-start;margin-bottom:var(--ev-sp-16)}
.col{display:flex;flex-direction:column;gap:var(--ev-sp-6)}
button{font-family:inherit;border:0;cursor:pointer}
</style>
<style>
.k{max-width:360px;background:var(--ev-white);border-radius:var(--ev-r-3xl);box-shadow:var(--ev-sh-card);padding:var(--ev-sp-14)}
.hd{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.bg{display:flex;justify-content:space-between;align-items:flex-end;margin-top:var(--ev-sp-6)}
.num{font-family:var(--font-display);font-size:56px;line-height:.95;font-weight:800;letter-spacing:-1.5px;color:var(--ev-purple-800)} .num small{font-family:var(--font-body);font-size:16px;font-weight:600;letter-spacing:0;color:var(--ev-ink-2);margin-left:6px}
.sub{font-size:12px;font-weight:500;color:var(--ev-ink-2);margin-top:6px}
.hut{background:var(--ev-purple-50);border-radius:var(--ev-r-xl);padding:var(--ev-sp-10) var(--ev-sp-14);text-align:left;font-size:12px;font-weight:500;color:var(--ev-ink-2)} .hut b{display:block;font-size:18px;font-weight:700;color:var(--ev-ink)}
.pr{height:8px;border-radius:4px;background:var(--ev-purple-100);margin-top:var(--ev-sp-14);overflow:hidden} .pr i{display:block;width:33%;height:100%;background:var(--ev-purple-600);border-radius:4px}
.pl{display:flex;justify-content:space-between;font-size:12px;font-weight:500;color:var(--ev-ink-2);margin-top:6px}
.cta{margin-top:var(--ev-sp-12);width:100%;height:56px;border-radius:var(--ev-r-xl);background:var(--ev-purple-600);box-shadow:var(--ev-sh-btn);color:#fff;font-size:16px;font-weight:700}
</style></head><body>
<div class="k"><div class="hd"><span>Hak cuti tahunan</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5a5578" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></div>
<div class="bg"><div><div class="num">8<small>hari</small></div><div class="sub">Tersedia untuk diajukan</div></div><div class="hut">Hutang cuti<b>0 hari</b></div></div>
<div class="pr"><i></i></div><div class="pl"><span>Terpakai 4 hari</span><span>Jatah 12 hari</span></div>
<button class="cta">Ajukan cuti</button></div>
</body></html>
