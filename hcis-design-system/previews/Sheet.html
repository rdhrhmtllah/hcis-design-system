<!doctype html><html><head>
<link rel="stylesheet" href="../assets/tokens.css"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ev-bg);font-family:var(--font-body);font-variant-numeric:tabular-nums;color:var(--ev-ink);padding:var(--ev-sp-16);-webkit-font-smoothing:antialiased}
.cap{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ev-ink-2);margin:0 0 var(--ev-sp-6)}
.row{display:flex;flex-wrap:wrap;gap:var(--ev-sp-12);align-items:flex-start;margin-bottom:var(--ev-sp-16)}
.col{display:flex;flex-direction:column;gap:var(--ev-sp-6)}
button{font-family:inherit;border:0;cursor:pointer}
</style>
<style>
body{padding:0}
.scrim{min-height:560px;background:rgba(26,21,53,.55);display:flex;align-items:flex-end;justify-content:center}
.sh{width:100%;max-width:390px;background:var(--ev-white);border-radius:var(--ev-r-3xl) var(--ev-r-3xl) 0 0;box-shadow:var(--ev-sh-sheet)}
.gr{display:block;width:40px;height:4px;border-radius:var(--ev-r-hair);background:var(--ev-purple-150);margin:var(--ev-sp-10) auto 0}
.hd{display:flex;align-items:center;gap:var(--ev-sp-8);padding:var(--ev-sp-6) var(--ev-sp-8) var(--ev-sp-4) 18px}
h3{margin:0;font-family:var(--font-display);font-size:20px;line-height:1.2;font-weight:700;letter-spacing:-.2px} p{margin:var(--ev-sp-2) 0 0;font-size:13px;line-height:1.35;font-weight:500;color:var(--ev-ink-2)}
.x{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none}.x span{width:34px;height:34px;border-radius:var(--ev-r-lg);background:var(--ev-purple-50);display:flex;align-items:center;justify-content:center}
.bd{padding:0 var(--ev-sp-14) 22px}.gl{padding:var(--ev-sp-14) var(--ev-sp-4) var(--ev-sp-6);font-size:12px;line-height:16px;font-weight:600;letter-spacing:.5px;color:var(--ev-ink-2)}
.rw{width:100%;min-height:62px;margin-bottom:var(--ev-sp-6);padding:var(--ev-sp-8) var(--ev-sp-12);border-radius:var(--ev-r-lg);display:flex;align-items:center;gap:var(--ev-sp-10)}
.tx{flex:1;min-width:0}.tx b{display:block;font-size:14px;line-height:19px;font-weight:700}.tx i{display:block;font-style:normal;font-size:12px;line-height:16px;font-weight:500;color:var(--ev-ink-2)}
.pl{flex:none;height:26px;padding:0 var(--ev-sp-10);border-radius:var(--ev-r-md);background:var(--ev-purple-100);font-size:12px;font-weight:600;line-height:26px;color:var(--ev-purple-800)}
.ck{flex:none;width:22px;height:22px;border-radius:var(--ev-r-md);border:2px solid;display:flex;align-items:center;justify-content:center}
</style></head><body>
<div class="scrim"><div class="sh"><span class="gr"></span>
<div class="hd"><div style="flex:1;min-width:0"><h3>Jenis cuti khusus</h3><p>Lama cuti mengikuti ketentuan perusahaan</p></div><button class="x" aria-label="Tutup"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ev-purple-800)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></span></button></div>
<div class="bd"><div class="gl">Keluarga</div><div class="rw" style="background:var(--ev-purple-50);border:2px solid var(--ev-purple-600)"><span class="tx"><b>Pernikahan sendiri</b><i>Cuti menikah</i></span><span class="pl">3 hari</span><span class="ck" style="background:var(--ev-purple-600);border-color:var(--ev-purple-600)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span></div><div class="rw" style="background:var(--ev-white);border:2px solid var(--ev-purple-100)"><span class="tx"><b>Pernikahan anak</b><i>Anak kandung menikah</i></span><span class="pl">2 hari</span><span class="ck" style="background:var(--ev-white);border-color:var(--ev-purple-150)"></span></div><div class="rw" style="background:var(--ev-white);border:2px solid var(--ev-purple-100)"><span class="tx"><b>Kelahiran anak</b><i>Istri melahirkan atau keguguran</i></span><span class="pl">2 hari</span><span class="ck" style="background:var(--ev-white);border-color:var(--ev-purple-150)"></span></div></div></div></div></body></html>
