<!doctype html><html><head>
<link rel="stylesheet" href="../assets/tokens.css"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ev-bg);font-family:var(--font-body);font-variant-numeric:tabular-nums;color:var(--ev-ink);padding:var(--ev-sp-16);-webkit-font-smoothing:antialiased}
.cap{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ev-ink-2);margin:0 0 var(--ev-sp-6)}
.row{display:flex;flex-wrap:wrap;gap:var(--ev-sp-12);align-items:flex-start;margin-bottom:var(--ev-sp-16)}
.col{display:flex;flex-direction:column;gap:var(--ev-sp-6)}
button{font-family:inherit;border:0;cursor:pointer}
</style>
<style>
b{font-weight:700;color:var(--ev-ink)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:var(--ev-sp-16);flex-wrap:wrap;padding:var(--ev-sp-12) var(--ev-sp-14);background:var(--ev-white);border-radius:var(--ev-r-xl);box-shadow:var(--ev-sh-row)}
.lf{display:flex;align-items:center;gap:var(--ev-sp-12);font-size:13px;font-weight:500;color:var(--ev-ink-2)}
.sel{display:flex;align-items:center;gap:var(--ev-sp-6);height:36px;padding:0 var(--ev-sp-12);border-radius:var(--ev-r-full);background:var(--ev-purple-50);box-shadow:inset 0 0 0 1px var(--ev-purple-150);font-size:12px;font-weight:600;color:var(--ev-ink)}
.ct{display:flex;align-items:center;gap:var(--ev-sp-4)}
.ct a{width:44px;height:44px;border-radius:var(--ev-r-lg);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--ev-ink)}
.ct a.on{background:var(--ev-purple-600);color:var(--ev-white);box-shadow:0 3px 0 var(--ev-purple-800);transform:translateY(-1px);font-weight:700}
.ct a.el{width:28px;color:var(--ev-ink-2)}
.nv{display:flex;align-items:center;gap:var(--ev-sp-4);height:44px;padding:0 var(--ev-sp-12);border-radius:var(--ev-r-lg);background:transparent;box-shadow:inset 0 0 0 1.5px var(--ev-purple-150);font-size:13px;font-weight:700;color:var(--ev-purple-800)}.nv:first-child{margin-right:var(--ev-sp-8)}.nv:last-child{margin-left:var(--ev-sp-8)}
.nv.dis{opacity:.45}
.tab{display:flex;align-items:center;justify-content:space-between;max-width:320px;padding:var(--ev-sp-8);background:var(--ev-white);border-radius:var(--ev-r-xl);box-shadow:var(--ev-sh-row);font-size:13px;font-weight:500;color:var(--ev-ink-2)}
.rb{width:44px;height:44px;border-radius:var(--ev-r-md);background:var(--ev-purple-100);color:var(--ev-purple-800);display:flex;align-items:center;justify-content:center}
.mb{background:var(--ev-white);border-radius:var(--ev-r-xl);box-shadow:var(--ev-sh-row);padding:var(--ev-sp-14)}
.ml{font-size:12px;font-weight:500;color:var(--ev-ink-2);margin-bottom:var(--ev-sp-8)}
.tk{height:6px;border-radius:var(--ev-r-full);background:var(--ev-purple-100);overflow:hidden;margin-bottom:var(--ev-sp-12)}.tk i{display:block;height:100%;border-radius:var(--ev-r-full);background:var(--ev-purple-600)}
.lm{width:100%;height:52px;border-radius:var(--ev-r-xl);background:var(--ev-white);box-shadow:inset 0 0 0 1.5px var(--ev-purple-600);color:var(--ev-purple-800);font-size:15px;font-weight:700}
.bc{display:inline-flex;align-items:center;gap:var(--ev-sp-8);height:40px;padding:0 var(--ev-sp-8);border-radius:var(--ev-r-xl);background:var(--ev-white);box-shadow:var(--ev-sh-row);font-size:13px;font-weight:600}
.hm{width:28px;height:28px;border-radius:var(--ev-r-md);background:var(--ev-purple-100);color:var(--ev-purple-800);display:flex;align-items:center;justify-content:center}
.bc i{display:flex;color:var(--ev-ink-3)}.bc a{color:var(--ev-purple-800)}.bc b{font-weight:600;padding:4px 12px;border-radius:var(--ev-r-md);background:var(--ev-purple-100);color:var(--ev-purple-800)}
</style></head><body>
<p class="cap">Desktop</p>
<div class="bar"><div class="lf"><span>Menampilkan <b>11 sampai 20</b> dari <b>34</b></span><button class="sel">10 baris <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div>
<div class="ct"><button class="nv"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path transform="rotate(180 12 12)" d="m9 6 6 6-6 6"/></svg> Sebelumnya</button><a>1</a><a class="on">2</a><a>3</a><a>4</a><button class="nv">Berikutnya <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button></div></div>
<p class="cap" style="margin-top:var(--ev-sp-14)">Rentang panjang dan halaman pertama</p>
<div class="bar"><div class="lf"><span>Menampilkan <b>1 sampai 10</b> dari <b>120</b></span></div>
<div class="ct"><button class="nv dis"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path transform="rotate(180 12 12)" d="m9 6 6 6-6 6"/></svg> Sebelumnya</button><a class="on">1</a><a>2</a><a>3</a><a class="el">…</a><a>12</a><button class="nv">Berikutnya <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button></div></div>
<div class="row" style="gap:var(--ev-sp-24);margin-top:var(--ev-sp-20);flex-wrap:nowrap">
<div style="flex:1;min-width:0"><p class="cap">Tablet</p><div class="tab"><button class="rb"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path transform="rotate(180 12 12)" d="m9 6 6 6-6 6"/></svg></button><span>Halaman <b>2</b> dari <b>4</b></span><button class="rb"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button></div></div>
<div style="width:300px;flex:none"><p class="cap">Mobile</p><div class="mb"><div class="ml"><span>Menampilkan <b>10</b> dari <b>34</b></span></div><div class="tk"><i style="width:30%"></i></div><button class="lm">Muat 10 lagi</button></div></div>
</div>
<p class="cap" style="margin-top:var(--ev-sp-20)">Breadcrumb</p>
<div class="bc"><span class="hm"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg></span><i><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></i><a>Pengajuan</a><i><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></i><b>Cuti Saya</b></div>
</body></html>
