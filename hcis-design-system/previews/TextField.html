<!doctype html><html><head>
<link rel="stylesheet" href="../assets/tokens.css"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ev-bg);font-family:var(--font-body);font-variant-numeric:tabular-nums;color:var(--ev-ink);padding:var(--ev-sp-16);-webkit-font-smoothing:antialiased}
.cap{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ev-ink-2);margin:0 0 var(--ev-sp-6)}
.row{display:flex;flex-wrap:wrap;gap:var(--ev-sp-12);align-items:flex-start;margin-bottom:var(--ev-sp-16)}
.col{display:flex;flex-direction:column;gap:var(--ev-sp-6)}
button{font-family:inherit;border:0;cursor:pointer}
</style>
<style>
.cd{width:100%;max-width:370px;background:var(--ev-white);border-radius:var(--ev-r-2xl);box-shadow:var(--ev-sh-card);padding:var(--ev-sp-14)}
.hdr{display:flex;align-items:center;gap:var(--ev-sp-10);margin-bottom:var(--ev-sp-12)}.hdr h3{margin:0;flex:1;font-size:15px;font-weight:700}
.nb{flex:none;width:24px;height:24px;border-radius:var(--ev-r-md);background:var(--ev-purple-600);font-size:12px;font-weight:600;line-height:24px;text-align:center;color:var(--ev-white)}
.f{display:flex;flex-direction:column;gap:var(--ev-sp-6)}.f label{font-size:12px;font-weight:600;color:var(--ev-ink)}
.in{display:flex;align-items:flex-start;padding:var(--ev-sp-10) var(--ev-sp-12);border-radius:var(--ev-r-lg);border:1.5px solid var(--ev-purple-150);background:var(--ev-field-bg);font-size:14px;line-height:1.45;font-weight:500;color:var(--ev-ink)}
.in.l1{align-items:center;height:48px;padding:0 var(--ev-sp-12)}.in.ta{height:84px}.in .ph{color:var(--ev-ink-2)}
.in.fc{border-color:var(--ev-purple-600);outline:2px solid var(--ev-purple-600);outline-offset:2px}.in.er{border-color:var(--ev-no-dot)}.in.dz{background:var(--ev-purple-50);color:var(--ev-ink-2)}
.ft{display:flex;justify-content:space-between;font-size:12px;font-weight:500;color:var(--ev-ink-2)}.ft.e{color:var(--ev-no-ink);justify-content:flex-start;gap:var(--ev-sp-4);align-items:center}
.st{font-size:11px;font-weight:600;color:var(--ev-ink-2);margin-top:2px}
</style></head><body>
<div class="cd"><div class="hdr"><span class="nb">3</span><h3>Alasan cuti</h3></div>
<div class="f"><div class="in ta"><span class="ph">Tulis keperluan cutimu…</span></div><div class="ft"><span>Minimal 5 karakter</span><span>0 / 200</span></div></div></div>
<div class="col" style="max-width:370px;margin-top:var(--ev-sp-16);gap:var(--ev-sp-14)">
<div class="f"><label>Cari pengajuan</label><div class="in l1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>&nbsp;<span class="ph">Cari jenis atau kode</span></div></div>
<div class="f"><label>Alasan cuti</label><div class="in l1 fc">Acara keluarga</div><span class="st">Fokus</span></div>
<div class="f"><label>Alasan cuti</label><div class="in l1 er">Cuti</div><div class="ft e"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4 3 20h18z"/><path d="M12 10v4M12 17h.01"/></svg>Isi alasan minimal 5 karakter</div></div>
<div class="f"><label>Sisa cuti</label><div class="in l1 dz">8 hari</div><span class="st">Nonaktif</span></div>
</div></body></html>
