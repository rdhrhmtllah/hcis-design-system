<!doctype html><html><head>
<link rel="stylesheet" href="../assets/tokens.css"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ev-bg);font-family:var(--font-body);font-variant-numeric:tabular-nums;color:var(--ev-ink);padding:var(--ev-sp-16);-webkit-font-smoothing:antialiased}
.cap{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ev-ink-2);margin:0 0 var(--ev-sp-6)}
.row{display:flex;flex-wrap:wrap;gap:var(--ev-sp-12);align-items:flex-start;margin-bottom:var(--ev-sp-16)}
.col{display:flex;flex-direction:column;gap:var(--ev-sp-6)}
button{font-family:inherit;border:0;cursor:pointer}
</style>
<style>
.lb{display:flex;justify-content:space-between;font-size:12px;font-weight:500;color:var(--ev-ink-2);margin-bottom:var(--ev-sp-6)}.lb b{color:var(--ev-ink);font-weight:600}
.tk{height:8px;border-radius:var(--ev-r-full);background:var(--ev-purple-100);overflow:hidden}.tk i{display:block;height:100%;border-radius:var(--ev-r-full);background:var(--ev-purple-600)}.tk i.w{background:var(--ev-wait-dot)}
</style></head><body>
<div class="col" style="max-width:380px;gap:var(--ev-sp-16)">
<div><div class="lb"><span>Mengunggah surat-dokter.pdf</span><b>62%</b></div><div class="tk"><i style="width:62%"></i></div></div>
<div><div class="lb"><span>Cuti tahunan terpakai</span><b>4 dari 12 hari</b></div><div class="tk"><i style="width:33%"></i></div></div>
<div><div class="lb"><span>Kuota cuti besar terpakai</span><b>11 dari 12 hari</b></div><div class="tk"><i class="w" style="width:92%"></i></div></div>
</div></body></html>
