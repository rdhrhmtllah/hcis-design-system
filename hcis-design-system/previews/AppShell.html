<!doctype html><html><head>
<link rel="stylesheet" href="../assets/tokens.css"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ev-bg);font-family:var(--font-body);font-variant-numeric:tabular-nums;color:var(--ev-ink);padding:var(--ev-sp-16);-webkit-font-smoothing:antialiased}
.cap{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ev-ink-2);margin:0 0 var(--ev-sp-6)}
.row{display:flex;flex-wrap:wrap;gap:var(--ev-sp-12);align-items:flex-start;margin-bottom:var(--ev-sp-16)}
.col{display:flex;flex-direction:column;gap:var(--ev-sp-6)}
button{font-family:inherit;border:0;cursor:pointer}
</style>
<style>
.stage{display:flex;gap:var(--ev-sp-20);align-items:flex-end;flex-wrap:wrap}
.dev{position:relative;background:var(--ev-bg);border:2px solid var(--ev-purple-150);border-radius:var(--ev-r-lg);display:flex;overflow:hidden;padding-bottom:0}
.fg{margin:0}.lb{display:block;margin-top:var(--ev-sp-8);text-align:center;font-size:12px;font-weight:600;color:var(--ev-ink-2)}
.dev{margin-bottom:0}
.ph{width:150px;height:300px;flex-direction:column;padding:8px}
.tb{width:300px;height:230px}.dk{width:420px;height:290px}
.hd{height:18px;border-radius:var(--ev-r-xs);background:var(--ev-purple-100);margin-bottom:8px}
.ct i{display:block;height:44px;border-radius:var(--ev-r-sm);background:var(--ev-white);box-shadow:var(--ev-sh-row);margin-bottom:8px}
.ph .ct{flex:1}.bn{height:30px;border-radius:var(--ev-r-xl);background:var(--ev-white);box-shadow:var(--ev-sh-card)}
.rail{width:38px;background:var(--ev-white);padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:8px}
.rail b,.sb b{width:22px;height:22px;border-radius:var(--ev-r-sm);background:var(--ev-purple-150)}
.sb{width:92px;background:var(--ev-purple-900);padding:10px;display:flex;flex-direction:column;gap:8px}.sb u{height:16px;border-radius:var(--ev-r-xs);background:var(--ev-gold)}.sb b{width:100%;height:18px;background:rgba(255,255,255,.18)}
.mn{flex:1;padding:8px;display:flex;flex-direction:column}.two{flex:1;display:flex;gap:8px}.two .ct{flex:1}.pn{width:34%;border-radius:var(--ev-r-md);background:var(--ev-white);box-shadow:var(--ev-sh-row)}
</style></head><body>
<div class="stage">
 <figure class="fg"><div class="dev ph"><div class="hd"></div><div class="ct"><i></i><i></i><i></i></div><div class="bn"></div></div><span class="lb">Mobile</span></figure>
 <figure class="fg"><div class="dev tb"><div class="rail"><b></b><b></b><b></b></div><div class="mn"><div class="hd"></div><div class="two"><div class="ct"><i></i><i></i></div><div class="pn"></div></div></div></div><span class="lb">Tablet</span></figure>
 <figure class="fg"><div class="dev dk"><div class="sb"><u></u><b></b><b></b><b></b></div><div class="mn"><div class="hd"></div><div class="two"><div class="ct"><i></i><i></i><i></i></div><div class="pn"></div></div></div></div><span class="lb">Desktop</span></figure>
</div></body></html>
