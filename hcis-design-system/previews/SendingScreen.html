<!doctype html><html><head>

<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ev-bg);font-family:var(--font-body);font-variant-numeric:tabular-nums;color:var(--ev-ink);padding:var(--ev-sp-16);-webkit-font-smoothing:antialiased}
.cap{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ev-ink-2);margin:0 0 var(--ev-sp-6)}
.row{display:flex;flex-wrap:wrap;gap:var(--ev-sp-12);align-items:flex-start;margin-bottom:var(--ev-sp-16)}
.col{display:flex;flex-direction:column;gap:var(--ev-sp-6)}
button{font-family:inherit;border:0;cursor:pointer}
</style>
<style>
body{padding:0;background:var(--ev-bg)}
.scr{position:relative;width:390px;height:844px;overflow:hidden;margin:0 auto;background:radial-gradient(circle at 50% 40%,var(--ev-purple-600) 0%,var(--ev-purple-800) 46%,var(--ev-purple-950) 100%)}
.bl{position:absolute;border-radius:var(--ev-r-full);filter:blur(46px);opacity:.4}
.st{position:absolute;left:0;height:2px;border-radius:var(--ev-r-hair);background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.4))}
.rt{position:absolute;left:20px;top:252px;width:350px;height:170px}
.dc{position:absolute;left:14px;top:78px;width:60px;height:80px;border-radius:var(--ev-r-lg);background:var(--ev-white);box-shadow:0 14px 26px -8px rgba(26,21,53,.6);padding:var(--ev-sp-12) var(--ev-sp-10)}
.dc span{display:block;height:5px;border-radius:var(--ev-r-xs);background:var(--ev-purple-edge);margin-top:7px}.dc .g1{width:24px;height:8px;background:var(--ev-gold);margin-top:0}.dc .g2{width:40px;margin-top:var(--ev-sp-10)}.dc .g3{width:30px}.dc .g4{width:36px}
.nd{position:absolute;width:18px;height:18px;border-radius:var(--ev-r-sm);border:2px solid}
.nd.s0{width:16px;height:16px;border:0;background:var(--ev-white);box-shadow:0 0 0 5px rgba(247,201,72,.35);left:129px;top:110px}
.lb{position:absolute;transform:translateX(-50%);font-size:12px;line-height:16px;font-weight:600;white-space:nowrap}
.tx{position:absolute;left:0;right:0;top:520px;text-align:center;padding:0 var(--ev-sp-24)}
h2{margin:0;font-family:var(--font-display);font-size:26px;line-height:1.15;font-weight:800;color:var(--ev-white);letter-spacing:-.4px}
.ms{margin-top:var(--ev-sp-8);font-size:14px;line-height:22px;font-weight:500;color:var(--ev-purple-150)}
.pl{display:inline-block;margin-top:18px;height:34px;padding:0 var(--ev-sp-16);border-radius:var(--ev-r-lg);background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);font-size:13px;line-height:32px;font-weight:600;color:var(--ev-white)}
.bar{position:absolute;left:85px;right:85px;bottom:96px;height:6px;border-radius:var(--ev-r-xs);background:rgba(255,255,255,.2);overflow:hidden}.bar span{display:block;width:55%;height:6px;border-radius:var(--ev-r-xs);background:var(--ev-gold)}
</style></head><body>

</body></html>
