<!doctype html><html><head>
<link rel="stylesheet" href="../assets/tokens.css"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ev-bg);font-family:var(--font-body);font-variant-numeric:tabular-nums;color:var(--ev-ink);padding:var(--ev-sp-16);-webkit-font-smoothing:antialiased}
.cap{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ev-ink-2);margin:0 0 var(--ev-sp-6)}
.row{display:flex;flex-wrap:wrap;gap:var(--ev-sp-12);align-items:flex-start;margin-bottom:var(--ev-sp-16)}
.col{display:flex;flex-direction:column;gap:var(--ev-sp-6)}
button{font-family:inherit;border:0;cursor:pointer}
</style>
<style>
.wr{display:inline-flex;flex-direction:column;align-items:center;gap:var(--ev-sp-8)}
.tp{position:relative;max-width:240px;padding:6px 10px;border-radius:var(--ev-r-md);background:var(--ev-purple-900);color:var(--ev-white);font-size:12px;line-height:17px;font-weight:500}
.tp i{position:absolute;left:50%;bottom:-4px;width:8px;height:8px;background:var(--ev-purple-900);transform:translateX(-50%) rotate(45deg)}
.ib{width:44px;height:44px;border-radius:var(--ev-r-full);background:var(--ev-white);box-shadow:var(--ev-sh-row);color:var(--ev-purple-800);display:flex;align-items:center;justify-content:center}
</style></head><body>
<div class="wr"><div class="tp">Ingatkan atasan sekali per jam<i></i></div><button class="ib"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg></button></div>
</body></html>
