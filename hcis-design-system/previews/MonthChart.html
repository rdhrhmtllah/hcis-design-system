<!doctype html><html><head>
<link rel="stylesheet" href="../assets/tokens.css"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ev-bg);font-family:var(--font-body);font-variant-numeric:tabular-nums;color:var(--ev-ink);padding:var(--ev-sp-16);-webkit-font-smoothing:antialiased}
.cap{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ev-ink-2);margin:0 0 var(--ev-sp-6)}
.row{display:flex;flex-wrap:wrap;gap:var(--ev-sp-12);align-items:flex-start;margin-bottom:var(--ev-sp-16)}
.col{display:flex;flex-direction:column;gap:var(--ev-sp-6)}
button{font-family:inherit;border:0;cursor:pointer}
</style>
<style>
.mc{max-width:362px;background:var(--ev-white);border-radius:var(--ev-r-2xl);box-shadow:var(--ev-sh-card);padding:var(--ev-sp-14)}
.top{display:flex;align-items:flex-end;justify-content:space-between}.lbl{display:block;font-size:12px;line-height:16px;font-weight:600;color:var(--ev-ink-2)}.num{display:block;font-family:var(--font-display);font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-.5px}.num small{font-size:15px;font-weight:600;color:var(--ev-ink-2);letter-spacing:0}
.pill{flex:none;height:26px;padding:0 var(--ev-sp-10);border-radius:var(--ev-r-md);background:var(--ev-purple-100);font-size:12px;line-height:26px;font-weight:600;color:var(--ev-purple-800)}
.bars{display:flex;align-items:flex-end;gap:var(--ev-sp-6);height:92px;margin-top:var(--ev-sp-14)}.cl{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:var(--ev-sp-4)}.bar{display:block;width:100%;border-radius:var(--ev-r-sm)}.mm{font-size:12px;line-height:16px}
</style></head><body><section class="mc"><div class="top"><div><span class="lbl">Cuti diambil tahun ini</span><span class="num">8<small> hari</small></span></div><span class="pill">4 hari potong saldo</span></div><div class="bars"><div class="cl"><span class="bar" style="height:30px;background:var(--ev-purple-300)"></span><span class="mm" style="font-weight:600;color:var(--ev-ink-2)">J</span></div><div class="cl"><span class="bar" style="height:6px;background:var(--ev-purple-100)"></span><span class="mm" style="font-weight:600;color:var(--ev-ink-2)">F</span></div><div class="cl"><span class="bar" style="height:44px;background:var(--ev-purple-300)"></span><span class="mm" style="font-weight:600;color:var(--ev-ink-2)">M</span></div><div class="cl"><span class="bar" style="height:6px;background:var(--ev-purple-100)"></span><span class="mm" style="font-weight:600;color:var(--ev-ink-2)">A</span></div><div class="cl"><span class="bar" style="height:6px;background:var(--ev-purple-100)"></span><span class="mm" style="font-weight:600;color:var(--ev-ink-2)">M</span></div><div class="cl"><span class="bar" style="height:30px;background:var(--ev-purple-300)"></span><span class="mm" style="font-weight:600;color:var(--ev-ink-2)">J</span></div><div class="cl"><span class="bar" style="height:6px;background:var(--ev-purple-100)"></span><span class="mm" style="font-weight:600;color:var(--ev-ink-2)">J</span></div><div class="cl"><span class="bar" style="height:30px;background:var(--ev-purple-300)"></span><span class="mm" style="font-weight:600;color:var(--ev-ink-2)">A</span></div><div class="cl"><span class="bar" style="height:6px;background:var(--ev-purple-100)"></span><span class="mm" style="font-weight:600;color:var(--ev-ink-2)">S</span></div><div class="cl"><span class="bar" style="height:44px;background:var(--ev-purple-300)"></span><span class="mm" style="font-weight:600;color:var(--ev-ink-2)">O</span></div><div class="cl"><span class="bar" style="height:58px;background:var(--ev-purple-600)"></span><span class="mm" style="font-weight:800;color:var(--ev-purple-800)">N</span></div><div class="cl"><span class="bar" style="height:6px;background:var(--ev-purple-100)"></span><span class="mm" style="font-weight:600;color:var(--ev-ink-2)">D</span></div></div></section></body></html>
