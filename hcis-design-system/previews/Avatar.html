<!doctype html><html><head>
<link rel="stylesheet" href="../assets/tokens.css"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ev-bg);font-family:var(--font-body);font-variant-numeric:tabular-nums;color:var(--ev-ink);padding:var(--ev-sp-16);-webkit-font-smoothing:antialiased}
.cap{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ev-ink-2);margin:0 0 var(--ev-sp-6)}
.row{display:flex;flex-wrap:wrap;gap:var(--ev-sp-12);align-items:flex-start;margin-bottom:var(--ev-sp-16)}
.col{display:flex;flex-direction:column;gap:var(--ev-sp-6)}
button{font-family:inherit;border:0;cursor:pointer}
</style>
<style>
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:var(--ev-r-md);background:var(--ev-purple-600);color:var(--ev-white);font-weight:600;flex:none}
.s56{width:56px;height:56px;font-size:18px}.s40{width:40px;height:40px;font-size:14px}.s32{width:32px;height:32px;font-size:12px;border-radius:var(--ev-r-sm)}.s24{width:24px;height:24px;font-size:11px;font-weight:700;border-radius:var(--ev-r-sm)}
.stk{display:inline-flex}.stk .av{border:2px solid var(--ev-bg);margin-left:-8px}.stk .av:first-child{margin-left:0}.b{background:var(--ev-purple-800)}.c{background:var(--ev-purple-150);color:var(--ev-purple-800)}
.bw{position:relative;display:inline-flex}.bd{position:absolute;top:-8px;right:-10px;min-width:18px;height:18px;padding:0 5px;border-radius:var(--ev-r-md);background:var(--ev-gold);color:var(--ev-gold-ink);font-style:normal;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--ev-bg);box-sizing:content-box}
.dt{position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:var(--ev-r-xs);background:var(--ev-gold);border:2px solid var(--ev-bg);box-sizing:content-box}
</style></head><body>
<div class="row" style="align-items:center;gap:var(--ev-sp-20)">
<span class="av s56">RM</span><span class="av s40">AP</span><span class="av s32">SW</span><span class="av s24">BK</span>
<span class="stk"><span class="av s40 a">RM</span><span class="av s40 b">AP</span><span class="av s40 c">+2</span></span>
<span class="bw"><span class="av s40">RM</span><i class="bd">3</i></span>
<span class="bw"><span class="av s40">AP</span><i class="dt"></i></span>
</div></body></html>
