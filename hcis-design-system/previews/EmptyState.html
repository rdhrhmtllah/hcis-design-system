<!doctype html><html><head>
<link rel="stylesheet" href="../assets/tokens.css"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ev-bg);font-family:var(--font-body);font-variant-numeric:tabular-nums;color:var(--ev-ink);padding:var(--ev-sp-16);-webkit-font-smoothing:antialiased}
.cap{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ev-ink-2);margin:0 0 var(--ev-sp-6)}
.row{display:flex;flex-wrap:wrap;gap:var(--ev-sp-12);align-items:flex-start;margin-bottom:var(--ev-sp-16)}
.col{display:flex;flex-direction:column;gap:var(--ev-sp-6)}
button{font-family:inherit;border:0;cursor:pointer}
</style>
<style>
.e{max-width:360px;margin:0 auto;background:var(--ev-white);border-radius:var(--ev-r-2xl);box-shadow:var(--ev-sh-card);padding:var(--ev-sp-20) var(--ev-sp-20) var(--ev-sp-16);text-align:center}
.il{width:96px;height:96px;margin:0 auto var(--ev-sp-10);border-radius:48px;background:var(--ev-purple-50);display:flex;align-items:center;justify-content:center;animation:fl 3.6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.il{animation:none}}
h3{margin:0;font-size:16px;line-height:1.25;font-weight:700} p{margin:6px 0 0;font-size:14px;line-height:1.45;font-weight:500;color:var(--ev-ink-2)}
button{margin-top:var(--ev-sp-14);height:44px;padding:0 20px;border-radius:var(--ev-r-lg);background:var(--ev-purple-600);box-shadow:var(--ev-sh-btn);color:#fff;font-size:14px;font-weight:700}
</style></head><body>
<div class="e"><div class="il"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#3b22a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17M12 12.5v5M9.5 15h5"/></svg></div>
<h3>Belum ada pengajuan aktif</h3><p>Ajukan cuti kapan saja. Statusnya akan muncul di sini.</p><button>Ajukan cuti</button></div>
</body></html>
