<!doctype html><html><head>
<link rel="stylesheet" href="../assets/tokens.css"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ev-bg);font-family:var(--font-body);font-variant-numeric:tabular-nums;color:var(--ev-ink);padding:var(--ev-sp-16);-webkit-font-smoothing:antialiased}
.cap{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ev-ink-2);margin:0 0 var(--ev-sp-6)}
.row{display:flex;flex-wrap:wrap;gap:var(--ev-sp-12);align-items:flex-start;margin-bottom:var(--ev-sp-16)}
.col{display:flex;flex-direction:column;gap:var(--ev-sp-6)}
button{font-family:inherit;border:0;cursor:pointer}
</style>
<style>
.r3{display:flex;gap:var(--ev-sp-8);max-width:390px}
.big,.cnt{flex:1;border:1px solid}
.big{border-radius:var(--ev-r-xl);padding:var(--ev-sp-12)} .big b{display:block;font-family:var(--font-display);font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.5px;color:var(--k)} .big span{display:block;margin-top:var(--ev-sp-2);font-size:12px;line-height:16px;font-weight:600;color:var(--ev-ink)}
.cnt{border-radius:var(--ev-r-lg);padding:9px var(--ev-sp-12);box-shadow:var(--ev-sh-pop)} .cnt em{display:block;font-style:normal;font-size:12px;font-weight:600;color:var(--k)} .cnt b{display:block;font-family:var(--font-display);font-size:26px;line-height:1.15;font-weight:800;color:var(--ev-ink)}
</style></head><body>
<p class="cap">Angka besar</p>
<div class="r3"><div class="big" style="background:var(--ev-ok-bg);border-color:var(--ev-ok-edge);--k:var(--ev-ok-ink)"><b>12</b><span>hari cuti per tahun</span></div><div class="big" style="background:var(--ev-purple-100);border-color:var(--ev-purple-edge);--k:var(--ev-purple-800)"><b>H-3</b><span>batas pengajuan</span></div><div class="big" style="background:var(--ev-info-bg);border-color:var(--ev-info-edge);--k:var(--ev-info-ink)"><b>2–3</b><span>tahap persetujuan</span></div></div>
<p class="cap" style="margin-top:var(--ev-sp-16)">Hitungan</p>
<div class="r3"><div class="cnt" style="background:var(--ev-purple-100);border-color:var(--ev-purple-edge);--k:var(--ev-purple-800)"><em>Berjalan</em><b>2</b></div><div class="cnt" style="background:var(--ev-ok-bg);border-color:var(--ev-ok-edge);--k:var(--ev-ok-ink)"><em>Selesai</em><b>3</b></div><div class="cnt" style="background:var(--ev-info-bg);border-color:var(--ev-info-edge);--k:var(--ev-info-ink)"><em>Terjadwal</em><b>1</b></div></div>
<p class="cap" style="margin-top:var(--ev-sp-16)">Nada oranye</p>
<div class="r3"><div class="cnt" style="background:var(--ev-wait-bg);border-color:var(--ev-wait-edge);--k:var(--ev-wait-ink)"><em>Menunggu</em><b>1</b></div></div>
</body></html>
