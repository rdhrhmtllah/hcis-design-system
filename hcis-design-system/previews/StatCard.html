<!doctype html><html><head>
<link rel="stylesheet" href="../assets/tokens.css"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ev-bg);font-family:var(--font-body);font-variant-numeric:tabular-nums;color:var(--ev-ink);padding:var(--ev-sp-16);-webkit-font-smoothing:antialiased}
.cap{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ev-ink-2);margin:0 0 var(--ev-sp-6)}
.row{display:flex;flex-wrap:wrap;gap:var(--ev-sp-12);align-items:flex-start;margin-bottom:var(--ev-sp-16)}
.col{display:flex;flex-direction:column;gap:var(--ev-sp-6)}
button{font-family:inherit;border:0;cursor:pointer}
</style>
<style>
.sc{position:relative;width:200px;background:var(--ev-white);border-radius:var(--ev-r-xl);box-shadow:var(--ev-sh-card);padding:var(--ev-sp-16);display:flex;flex-direction:column;gap:var(--ev-sp-4)}
.sc small{font-size:12px;font-weight:500;color:var(--ev-ink-2)}.sc p{margin:0;font-size:14px;font-weight:500;color:var(--ev-ink-2)}
.sc b{font-family:var(--font-display);font-size:32px;line-height:38px;font-weight:800;color:var(--ev-ink)}.up{color:var(--ev-ok-ink)!important;font-weight:600!important}
.ico{position:absolute;top:var(--ev-sp-12);right:var(--ev-sp-12);width:38px;height:38px;border-radius:var(--ev-r-md);background:var(--ev-purple-100);color:var(--ev-purple-800);box-shadow:0 3px 0 var(--ev-purple-300);display:flex;align-items:center;justify-content:center}.ico.g{background:var(--ev-gold);color:var(--ev-gold-ink);box-shadow:0 3px 0 var(--ev-gold-edge)}
</style></head><body>
<div class="row">
<div class="sc"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8 3v4M16 3v4"/></svg></span><small>Sisa cuti</small><p><b>8</b> hari</p><small>dari 12 hari tahun ini</small></div>
<div class="sc"><span class="ico g"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><small>Menunggu</small><p><b>2</b> pengajuan</p><small>1 di atasan, 1 di HR</small></div>
<div class="sc"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span><small>Disetujui</small><p><b>5</b> pengajuan</p><small class="up">naik 2 dari bulan lalu</small></div>
</div></body></html>
