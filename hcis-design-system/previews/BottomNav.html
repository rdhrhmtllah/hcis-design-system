<!doctype html><html><head>
<link rel="stylesheet" href="../assets/tokens.css"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ev-bg);font-family:var(--font-body);font-variant-numeric:tabular-nums;color:var(--ev-ink);padding:var(--ev-sp-16);-webkit-font-smoothing:antialiased}
.cap{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ev-ink-2);margin:0 0 var(--ev-sp-6)}
.row{display:flex;flex-wrap:wrap;gap:var(--ev-sp-12);align-items:flex-start;margin-bottom:var(--ev-sp-16)}
.col{display:flex;flex-direction:column;gap:var(--ev-sp-6)}
button{font-family:inherit;border:0;cursor:pointer}
</style>
<style>
body{padding:var(--ev-sp-16) var(--ev-sp-14) var(--ev-sp-14)}
.nav{position:relative;max-width:380px;margin:var(--ev-sp-20) auto 0;height:64px;background:var(--ev-white);border-radius:var(--ev-r-3xl);box-shadow:var(--ev-sh-card);display:flex;align-items:flex-end;padding-bottom:8px}
.i{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--ev-ink-2)} .i.on{color:var(--ev-purple-800)}
.mid{flex:1;display:flex;flex-direction:column;align-items:center}
.fab{position:relative;margin-top:-34px;width:56px;height:56px;border-radius:var(--ev-r-xl);background:linear-gradient(145deg,var(--ev-purple-400),var(--ev-purple-700));border:4px solid var(--ev-white);box-shadow:0 10px 18px -6px rgba(76,47,196,.65),inset 0 1px 0 rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;margin-bottom:3px}
.sp{transform-origin:23.5px 4.5px;animation:tw 3.6s ease-in-out infinite;opacity:0}
@keyframes tw{0%,62%{opacity:0;transform:scale(.2)}72%{opacity:1;transform:scale(1.15) rotate(45deg)}82%{opacity:1;transform:scale(.85) rotate(90deg)}94%,100%{opacity:0;transform:scale(.2)}}
@media (prefers-reduced-motion:reduce){.sp{animation:none;opacity:1;transform:scale(.9)}}
</style></head><body>
<div class="nav">
<div class="i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Beranda</div>
<div class="i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Presensi</div>
<div class="mid"><span class="fab"><svg width="30" height="30" viewBox="0 0 28 28" fill="none" style="overflow:visible"><path d="M4.5 22.5V12.2L13 4.2l4.6 4.2" stroke="#f2c94c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M17.6 8.4l5 4.4v9.7H10" stroke="#c8962f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.5 13.2h5.2M9.5 17h4" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".92"/><g class="sp"><path d="M23.5 .6l1.1 2.8 2.8 1.1-2.8 1.1-1.1 2.8-1.1-2.8-2.8-1.1 2.8-1.1z" fill="#fff"/></g></svg></span><span style="font-size:12px;font-weight:700;color:var(--ev-purple-800)">Menu</span></div>
<div class="i on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>Pengajuan</div>
<div class="i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profil</div>
</div></body></html>
