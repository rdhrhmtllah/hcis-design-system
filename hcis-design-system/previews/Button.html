<!doctype html><html><head>
<link rel="stylesheet" href="../assets/tokens.css"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ev-bg);font-family:var(--font-body);font-variant-numeric:tabular-nums;color:var(--ev-ink);padding:var(--ev-sp-16);-webkit-font-smoothing:antialiased}
.cap{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ev-ink-2);margin:0 0 var(--ev-sp-6)}
.row{display:flex;flex-wrap:wrap;gap:var(--ev-sp-12);align-items:flex-start;margin-bottom:var(--ev-sp-16)}
.col{display:flex;flex-direction:column;gap:var(--ev-sp-6)}
button{font-family:inherit;border:0;cursor:pointer}
</style>
<style>
.cta{display:flex;align-items:center;gap:var(--ev-sp-10);width:100%;max-width:360px;height:56px;padding:0 var(--ev-sp-12) 0 var(--ev-sp-10);border-radius:var(--ev-r-xl);background:var(--ev-purple-600);box-shadow:var(--ev-sh-btn);text-align:left;color:var(--ev-white)}
.cta .ic{flex:none;width:38px;height:38px;border-radius:var(--ev-r-md);background:var(--ev-gold);box-shadow:0 2px 0 var(--ev-gold-edge);display:flex;align-items:center;justify-content:center}
.cta .t{flex:1} .cta b{display:block;font-size:16px;line-height:1.2;font-weight:700} .cta span.s{display:block;font-size:12px;font-weight:500;margin-top:1px}
.cta .ar{width:30px;height:30px;border-radius:var(--ev-r-md);background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.b{height:54px;border-radius:var(--ev-r-xl);padding:0 18px;font-size:15px;font-weight:700}
.p{background:var(--ev-purple-600);box-shadow:var(--ev-sh-btn);color:var(--ev-white)}
.d{background:var(--ev-white);border:1.5px solid var(--ev-no-edge);color:var(--ev-no-ink)}
.ok{background:var(--ev-ok-bg);color:var(--ev-ok-ink);cursor:default}
.dis{opacity:.55;cursor:not-allowed}
</style></head><body>
<p class="cap">Utama · beranda</p>
<div class="row"><button class="cta"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3b22a0" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span class="t"><b>Ajukan cuti</b><span class="s">Pilih tanggal dan keperluanmu</span></span><span class="ar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span></button></div>
<p class="cap">Detail dan sheet</p>
<div class="row">
<div class="col"><button class="b d">Batalkan</button><small style="font-size:12px;color:var(--ev-ink-2)">Berbahaya</small></div>
<div class="col"><button class="b p">Ingatkan atasan</button><small style="font-size:12px;color:var(--ev-ink-2)">Normal</small></div>
<div class="col"><button class="b p dis" aria-disabled="true">Mengirim…</button><small style="font-size:12px;color:var(--ev-ink-2)">Memuat</small></div>
<div class="col"><button class="b ok" aria-disabled="true">Sudah diingatkan</button><small style="font-size:12px;color:var(--ev-ink-2)">Selesai</small></div>
</div></body></html>
