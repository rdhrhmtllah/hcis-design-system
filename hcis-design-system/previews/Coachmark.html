<!doctype html><html><head>
<link rel="stylesheet" href="../assets/tokens.css"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ev-bg);font-family:var(--font-body);font-variant-numeric:tabular-nums;color:var(--ev-ink);padding:var(--ev-sp-16);-webkit-font-smoothing:antialiased}
.cap{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ev-ink-2);margin:0 0 var(--ev-sp-6)}
.row{display:flex;flex-wrap:wrap;gap:var(--ev-sp-12);align-items:flex-start;margin-bottom:var(--ev-sp-16)}
.col{display:flex;flex-direction:column;gap:var(--ev-sp-6)}
button{font-family:inherit;border:0;cursor:pointer}
</style>
<style>
body{padding:0}
.sc{position:relative;width:390px;height:400px;margin:0 auto;background:rgba(26,21,53,.55);overflow:hidden}
.tg{position:absolute;left:24px;top:30px;width:342px;height:64px;border-radius:var(--ev-r-xl);background:var(--ev-white);display:flex;align-items:center;padding:0 var(--ev-sp-16);font-size:14px;font-weight:700}
.rng{position:absolute;left:18px;top:24px;width:354px;height:76px;border-radius:var(--ev-r-xl);border:2px solid var(--ev-gold);box-shadow:0 0 0 999px rgba(26,21,53,0)}
.cd{position:absolute;left:45px;top:124px;width:300px;background:var(--ev-white);border-radius:var(--ev-r-xl);box-shadow:var(--ev-sh-pop);padding:var(--ev-sp-14)}
.tail{position:absolute;left:44px;top:-6px;width:12px;height:12px;background:var(--ev-white);transform:rotate(45deg);border-radius:var(--ev-r-xs)}
.hd{display:flex;align-items:center;gap:var(--ev-sp-8)}.n{width:22px;height:22px;border-radius:var(--ev-r-full);border:1px solid var(--ev-purple-edge);font-size:12px;font-weight:600;line-height:20px;text-align:center;color:var(--ev-purple-800)}.of{font-size:12px;font-weight:600;color:var(--ev-purple-accent)}
.cd b{display:block;margin-top:var(--ev-sp-8);font-size:15px;font-weight:700}.cd p{margin:var(--ev-sp-2) 0 0;font-size:13px;line-height:1.5;font-weight:500;color:var(--ev-ink-2)}
.ac{display:flex;align-items:center;gap:var(--ev-sp-4);margin-top:var(--ev-sp-10)}.skip{height:44px;padding:0 var(--ev-sp-4);font-size:13px;font-weight:600;color:var(--ev-ink-2);background:none}.bk{height:36px;padding:0 var(--ev-sp-10);font-size:13px;font-weight:700;color:var(--ev-purple-800);background:none}.nx{height:36px;padding:0 var(--ev-sp-16);border-radius:var(--ev-r-lg);background:var(--ev-purple-600);font-size:13px;font-weight:700;color:var(--ev-white)}
</style></head><body>
<div class="sc"><div class="tg">Ajukan cuti baru</div><span class="rng"></span>
<div class="cd"><span class="tail"></span><div class="hd"><span class="n">2</span><span class="of">dari 5 langkah</span></div><b>Ajukan cuti baru</b><p>Ketuk tombol ini untuk memilih tanggal dan jenis cuti.</p><div class="ac"><button class="skip">Lewati tur</button><span style="flex:1"></span><button class="bk">Kembali</button><button class="nx">Lanjut</button></div></div></div>
</body></html>
