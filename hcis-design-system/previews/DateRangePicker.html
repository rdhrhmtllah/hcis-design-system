<style>

html,body{margin:0}

button{font-family:inherit;border:0;cursor:pointer}
</style>
<style>

.mh{display:flex;align-items:center;justify-content:space-between;margin:var(--ev-sp-8) 0}.mh b{font-family:var(--font-display);font-size:16px;font-weight:700}

.g{display:grid;grid-template-columns:repeat(7,1fr)}.dn{font-style:normal;text-align:center;font-size:12px;font-weight:600;color:var(--ev-ink-2);padding:var(--ev-sp-6) 0}
.c,.e{height:44px;display:flex;align-items:center;justify-content:center;font-weight:400}
.c.band{background:var(--ev-purple-200)}.c.bs{background:linear-gradient(90deg,transparent 50%,var(--ev-purple-200) 50%)}.c.be{background:linear-gradient(90deg,var(--ev-purple-200) 50%,transparent 50%)}
.d{position:relative;width:40px;height:40px;border-radius:var(--ev-r-full);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--ev-ink)}
.d.off{color:var(--ev-ink-3)}.d.td{box-shadow:inset 0 0 0 1.5px var(--ev-purple-400)}
.d.sel{background:var(--ev-purple-600);color:var(--ev-white);font-weight:800}
.d.hol::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:2px;background:var(--ev-no-ink)}
</style></head><body>
