<!doctype html><html><head>
<link rel="stylesheet" href="../assets/tokens.css"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ev-bg);font-family:var(--font-body);font-variant-numeric:tabular-nums;color:var(--ev-ink);padding:var(--ev-sp-16);-webkit-font-smoothing:antialiased}
.cap{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ev-ink-2);margin:0 0 var(--ev-sp-6)}
.row{display:flex;flex-wrap:wrap;gap:var(--ev-sp-12);align-items:flex-start;margin-bottom:var(--ev-sp-16)}
.col{display:flex;flex-direction:column;gap:var(--ev-sp-6)}
button{font-family:inherit;border:0;cursor:pointer}
</style>
<style>
.gr{display:grid;grid-template-columns:1fr 1fr;gap:var(--ev-sp-8);max-width:370px}
.cc{position:relative;text-align:left;min-height:84px;padding:var(--ev-sp-10);border-radius:var(--ev-r-lg);background:var(--ev-white);border:2px solid var(--ev-purple-150);display:flex;flex-direction:column;gap:var(--ev-sp-6)}
.cc.on{background:var(--ev-purple-50);border-color:var(--ev-purple-600)}
.ti{width:30px;height:30px;border-radius:var(--ev-r-md);border:1px solid;display:flex;align-items:center;justify-content:center}
.cc b{display:block;font-size:14px;line-height:18px;font-weight:700;color:var(--ev-ink)}.cc small{display:block;font-size:12px;line-height:16px;font-weight:500;color:var(--ev-ink-2)}
.ck{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:var(--ev-r-md);background:var(--ev-purple-600);color:var(--ev-white);display:flex;align-items:center;justify-content:center}
.ln{display:flex;align-items:center;gap:var(--ev-sp-10);min-height:44px;font-size:14px;font-weight:500}
.cb,.rd{width:22px;height:22px;border:2px solid var(--ev-purple-300);background:var(--ev-white);display:flex;align-items:center;justify-content:center;flex:none}.cb{border-radius:var(--ev-r-sm)}.rd{border-radius:var(--ev-r-full)}
.cb.on{background:var(--ev-purple-600);border-color:var(--ev-purple-600);color:var(--ev-white)}.rd.on{border-color:var(--ev-purple-600)}.rd.on::after{content:"";width:10px;height:10px;border-radius:5px;background:var(--ev-purple-600)}
.sw{width:44px;height:26px;border-radius:13px;background:var(--ev-purple-150);position:relative;flex:none}.sw b{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:var(--ev-white)}.sw.on{background:var(--ev-purple-600)}.sw.on b{left:21px}
</style></head><body>
<div class="gr"><button class="cc on"><span class="ti" style="background:var(--ev-purple-100);border-color:var(--ev-purple-edge);color:var(--ev-purple-800)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8 3v4M16 3v4"/></svg></span><span><b>Tahunan</b><small>Memotong saldo</small></span><span class="ck"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span></button><button class="cc"><span class="ti" style="background:var(--ev-no-bg);border-color:var(--ev-no-edge);color:var(--ev-no-ink)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span><b>Sakit</b><small>Perlu surat dokter</small></span></button><button class="cc"><span class="ti" style="background:var(--ev-ok-bg);border-color:var(--ev-ok-edge);color:var(--ev-ok-ink)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span><span><b>Khusus</b><small>Menikah, duka, dll.</small></span></button><button class="cc"><span class="ti" style="background:var(--ev-wait-bg);border-color:var(--ev-wait-edge);color:var(--ev-wait-ink)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="3"/><circle cx="12" cy="12" r="2.5"/></svg></span><span><b>Tanpa gaji</b><small>Tidak potong saldo</small></span></button></div>
<p class="cap" style="margin-top:var(--ev-sp-16)">Kontrol kecil (usulan)</p>
<div class="row" style="gap:var(--ev-sp-20)">
<label class="ln"><i class="cb on"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></i>Setengah hari</label>
<label class="ln"><i class="rd on"></i>Tahunan</label>
<label class="ln"><i class="sw on"><b></b></i>Ingatkan saya</label>
</div></body></html>
