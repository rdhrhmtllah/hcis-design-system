<!doctype html><html><head>
<link rel="stylesheet" href="../assets/tokens.css"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ev-bg);font-family:var(--font-body);font-variant-numeric:tabular-nums;color:var(--ev-ink);padding:var(--ev-sp-16);-webkit-font-smoothing:antialiased}
.cap{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ev-ink-2);margin:0 0 var(--ev-sp-6)}
.row{display:flex;flex-wrap:wrap;gap:var(--ev-sp-12);align-items:flex-start;margin-bottom:var(--ev-sp-16)}
.col{display:flex;flex-direction:column;gap:var(--ev-sp-6)}
button{font-family:inherit;border:0;cursor:pointer}
</style>
<style>
.t{position:relative;display:flex;align-items:center;gap:var(--ev-sp-10);max-width:360px;margin-bottom:var(--ev-sp-12);padding:var(--ev-sp-10) var(--ev-sp-10) var(--ev-sp-12);border-radius:var(--ev-r-xl);border:1px solid var(--tc);background:var(--tt);overflow:hidden}
.d{flex:none;width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:var(--td)}
.x{flex:1;min-width:0} .x b{display:block;font-size:15px;line-height:1.25;font-weight:700} .x span{display:block;font-size:12px;line-height:16px;font-weight:500;color:var(--ev-ink-2)}
.a{flex:none;height:32px;padding:0 12px;border-radius:16px;background:var(--ta);color:var(--tk);font-size:12px;font-weight:700}
.bar{position:absolute;left:0;bottom:0;height:3px;width:60%;background:var(--tb);border-radius:2px}
</style></head><body>
<div class="t" style="--tc:#e4ddfb;--tt:#f4f0ff;--td:linear-gradient(145deg,#f4f0ff,#e4ddfb);--ta:#e4ddfb;--tk:#3b22a0;--tb:#5b3bd8"><span class="d"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5b3bd8" stroke-width="3" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"/></svg></span><div class="x"><b>Mengirim pengingat…</b><span>Sebentar, atasan sedang diberi tahu.</span></div></div>
<div class="t" style="--tc:#b7e3c6;--tt:#eaf9ef;--td:linear-gradient(145deg,#7ee2a0,#2e9e5b);--ta:#ddf5e4;--tk:#14532d;--tb:#2e9e5b"><span class="d"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0b3d20" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 9.5 17 19 7.5"/></svg></span><div class="x"><b>Pengajuan dibatalkan</b><span>Saldo 2 hari sudah kembali.</span></div><button class="a">Urungkan</button><span class="bar"></span></div>
<div class="t" style="--tc:#f6c3d3;--tt:#ffebf1;--td:linear-gradient(145deg,#ff86a8,#cd3e6a);--ta:#ffe0ea;--tk:#9b1c48;--tb:#cd3e6a"><span class="d"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></span><div class="x"><b>Koneksi terputus</b><span>Periksa sinyal atau Wi-Fi, lalu coba lagi.</span></div><button class="a">Coba lagi</button><span class="bar"></span></div>
<div class="t" style="--tc:#f8cba6;--tt:#ffebdd;--td:linear-gradient(145deg,#ffc08a,#f57c2a);--ta:#ffe9d6;--tk:#7a3200;--tb:#f57c2a"><span class="d"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M12 6v7M12 17.5h.01"/></svg></span><div class="x"><b>Sudah diingatkan</b><span>Coba lagi dalam 1 jam.</span></div><span class="bar"></span></div>
<div class="t" style="--tc:#d9d0f5;--tt:#f1eefc;--td:linear-gradient(145deg,#a78bfa,#5b3bd8);--ta:#e4ddfb;--tk:#3b22a0;--tb:#5b3bd8"><span class="d"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M12 11v6M12 7h.01"/></svg></span><div class="x"><b>Data diperbarui</b><span>Daftar pengajuan sudah yang terbaru.</span></div><span class="bar"></span></div>
</body></html>
