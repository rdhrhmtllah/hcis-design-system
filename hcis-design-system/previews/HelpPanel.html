<!doctype html><html><head>
<link rel="stylesheet" href="../assets/tokens.css"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ev-bg);font-family:var(--font-body);font-variant-numeric:tabular-nums;color:var(--ev-ink);padding:var(--ev-sp-16);-webkit-font-smoothing:antialiased}
.cap{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ev-ink-2);margin:0 0 var(--ev-sp-6)}
.row{display:flex;flex-wrap:wrap;gap:var(--ev-sp-12);align-items:flex-start;margin-bottom:var(--ev-sp-16)}
.col{display:flex;flex-direction:column;gap:var(--ev-sp-6)}
button{font-family:inherit;border:0;cursor:pointer}
</style>
<style>
.tc{max-width:362px;border-radius:var(--ev-r-xl);background:var(--ev-white);border:1px solid var(--ev-purple-100);box-shadow:var(--ev-sh-row);padding:var(--ev-sp-14)}
.tc .h{display:flex;align-items:center;gap:var(--ev-sp-12)}
.tc .ic{flex:none;width:44px;height:44px;border-radius:var(--ev-r-lg);background:var(--ev-gold);border:1px solid var(--ev-gold-edge);display:flex;align-items:center;justify-content:center}
.tc .t{flex:1;min-width:0}.tc .t b{display:block;font-size:15px;line-height:20px;font-weight:700}.tc .t span{display:block;font-size:12px;line-height:18px;font-weight:500;color:var(--ev-ink-2)}
.tc .ok{flex:none;height:24px;padding:0 var(--ev-sp-10);border-radius:var(--ev-r-md);background:var(--ev-ok-bg);border:1px solid var(--ev-ok-edge);font-size:12px;font-weight:600;line-height:22px;color:var(--ev-ok-ink)}
.tc .ls{margin-top:var(--ev-sp-12);display:flex;flex-direction:column;gap:var(--ev-sp-2)}
.tc .st{display:flex;align-items:center;gap:var(--ev-sp-10);min-height:30px;font-size:13px;font-weight:500}
.tc .n{flex:none;width:22px;height:22px;border-radius:var(--ev-r-full);background:var(--ev-white);border:1px solid var(--ev-purple-edge);font-size:12px;font-weight:600;line-height:20px;text-align:center;color:var(--ev-purple-800)}
.tc .go{margin-top:var(--ev-sp-12);width:100%;height:48px;border-radius:var(--ev-r-lg);background:linear-gradient(145deg,var(--ev-purple-accent),var(--ev-purple-700));box-shadow:0 10px 18px -8px rgba(76,47,196,.7);display:flex;align-items:center;justify-content:center;gap:var(--ev-sp-8);font-size:14px;font-weight:700;color:var(--ev-white)}
.hint{max-width:362px;margin:var(--ev-sp-10) var(--ev-sp-4) 0;font-size:12px;line-height:1.5;font-weight:500;color:var(--ev-ink-2)}

body{padding:0}
.hp{width:390px;margin:0 auto;background:var(--ev-bg);min-height:640px}
.hh{background:linear-gradient(180deg,var(--ev-purple-900),var(--ev-purple-700));padding:var(--ev-sp-12) var(--ev-sp-16) var(--ev-sp-16);border-radius:0 0 var(--ev-r-3xl) var(--ev-r-3xl)}
.hh h2{margin:0;font-family:var(--font-display);font-size:22px;line-height:1.15;font-weight:700;color:var(--ev-white);letter-spacing:-.3px}.hh p{margin:1px 0 0;font-size:12px;font-weight:500;color:var(--ev-purple-150)}
.sg{position:relative;margin-top:var(--ev-sp-12);height:42px;border-radius:var(--ev-r-xl);background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2);display:flex}
.ind{position:absolute;top:3px;left:3px;width:calc((100% - 6px)/3);height:34px;border-radius:var(--ev-r-lg);background:var(--ev-white);box-shadow:0 4px 10px -2px rgba(26,21,53,.4)}
.sg button{position:relative;flex:1;font-size:13px;font-weight:700;background:none}
.bd{padding:var(--ev-sp-14)}
</style></head><body><div class="hp"><div class="hh"><h2>Bantuan</h2><p>Tur, panduan, dan kontak PIC</p><div class="sg"><span class="ind" style="transform:translateX(0%)"></span><button style="color:var(--ev-purple-800)">Tur</button><button style="color:var(--ev-white)">Panduan</button><button style="color:var(--ev-white)">PIC Modul</button></div></div><div class="bd"><div class="tc"><div class="h"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ev-ok-ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18c4 0 3-6 8-6s3-6 8-6M4 18h.01M20 6h.01"/></svg></span><div class="t"><b>Tur Cuti Saya</b><span>5 langkah · ± 1 menit</span></div><span class="ok">Tersedia</span></div>
<div class="ls"><div class="st"><span class="n">1</span>Cek saldo cuti kamu</div><div class="st"><span class="n">2</span>Ajukan cuti baru</div><div class="st"><span class="n">3</span>Pantau pengajuan aktif</div><div class="st"><span class="n">4</span>Buka menu semua modul</div><div class="st"><span class="n">5</span>Cari bantuan kapan saja</div></div>
<button class="go"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>Mulai tur</button></div>
<p class="hint">Tur akan menyorot tiap bagian halaman satu per satu. Kamu bisa berhenti kapan saja.</p></div></div></body></html>
